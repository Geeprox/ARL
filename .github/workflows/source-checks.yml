name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core, policy, parser and publication regressions
        run: python -B script/check.py --profile portable --output build/ci-portable
  native-source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile complete native source without signing or launch
        run: python3 -B script/check_native_source.py
