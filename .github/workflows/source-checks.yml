name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core, policy, parser and publication regressions
        run: python -B script/check.py --profile portable --output build/ci-portable
      - name: Preserve failing test receipts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-receipts
          path: build/ci-portable/
  native-source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native lifecycle and identity regressions
        run: python3 -B script/check.py --profile native --module tests.test_research --module tests.test_research_product_socket --module tests.test_notes_focus --module tests.test_install_child_drain --module tests.test_tisra_capture_process --module tests.test_bundled_runtime_watchdog --module tests.test_codex_package_settings --module tests.test_application_native --output build/ci-native-identity
      - name: Compile complete native source without signing or launch
        run: python3 -B script/check_native_source.py
      - name: Preserve failing native test receipts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-receipts
          path: build/ci-native-identity/
