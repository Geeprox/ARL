<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">ARL · 两条能力主线与管理平面</title>
<desc id="desc">运行时就绪、产品身份与动作授权分别核验。实线表示已有组件或代码路径，虚线表示未启用或仍待真实验收，不表示生产权限已授予。</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #242b27; }
.title { font-size: 30px; font-weight: 650; } .sub { font-size: 17px; fill: #626d66; }
.heading { font-size: 21px; font-weight: 600; } .body { font-size: 17px; } .note { font-size: 16px; fill: #626d66; }
.box { fill: #ffffff; stroke: #cbd3cc; stroke-width: 1.5; }
.pending { fill: #faf7ee; stroke: #b1a68a; stroke-width: 1.5; stroke-dasharray: 7 5; }
.line { fill: none; stroke: #65736b; stroke-width: 2; }
.wait { stroke-dasharray: 7 5; }
</style>
<rect width="1200" height="760" fill="#f4f5f1"/>
<text x="40" y="58" class="title">ARL · 两条能力主线与管理平面</text>
<text x="40" y="92" class="sub">运行时就绪、产品身份与动作授权分别核验</text>
<rect x="40" y="138" width="340" height="130" rx="12" class="pending"/>
<text x="62" y="172" class="heading">本地 App Agent</text>
<text x="62" y="202" class="body">本地应用：记录 / 研究证据</text>
<text x="62" y="229" class="body">本地应用：家庭 / 设备 / NAS</text>
<text x="62" y="256" class="body">生产任务身份与 grant 待接入</text>
<rect x="430" y="138" width="340" height="130" rx="12" class="box"/>
<text x="452" y="172" class="heading">云端 Bot / Mio</text>
<text x="452" y="202" class="body">既有 Tunnel · 受控工具</text>
<text x="452" y="229" class="body">限定能力与供应方状态</text>
<text x="452" y="256" class="body">新增本机动作需独立权限</text>
<rect x="820" y="138" width="340" height="130" rx="12" class="box"/>
<text x="842" y="172" class="heading">ARLControl 管理面</text>
<text x="842" y="202" class="body">聚合状态 / 资源 / 有限日志</text>
<text x="842" y="229" class="body">public settings 元数据</text>
<text x="842" y="256" class="body">不读取任务正文，不授予执行</text>
<rect x="40" y="348" width="340" height="144" rx="12" class="box"/>
<text x="62" y="382" class="heading">宿主身份与权限门</text>
<text x="62" y="412" class="body">内核 peer / 签名 / 固定 manifest</text>
<text x="62" y="439" class="body">工具 / owner / schema / 预算</text>
<text x="62" y="466" class="body">默认生产 profile 不执行任务</text>
<rect x="430" y="348" width="340" height="144" rx="12" class="box"/>
<text x="452" y="382" class="heading">持久队列与生命周期</text>
<text x="452" y="412" class="body">去重 / 冲突 / 取消 / 恢复</text>
<text x="452" y="439" class="body">期限 / needs_unlock / needs_review</text>
<text x="452" y="466" class="body">未知外部效果不自动重放</text>
<rect x="820" y="348" width="340" height="144" rx="12" class="box"/>
<text x="842" y="382" class="heading">公共元数据</text>
<text x="842" y="412" class="body">运行时 / 连接新鲜度 / health</text>
<text x="842" y="439" class="body">有限资源采样与脱敏日志</text>
<text x="842" y="466" class="body">健康不等于能力授权</text>
<path d="M 210 268 V 348" class="line wait"/>
<polygon points="210,348 206,340 214,340" fill="#65736b"/>
<path d="M 600 268 V 304 H 280 V 348" class="line"/>
<polygon points="280,348 276,340 284,340" fill="#65736b"/>
<path d="M 380 420 H 430" class="line"/>
<polygon points="430,420 422,424 422,416" fill="#65736b"/>
<path d="M 990 268 V 348" class="line"/>
<polygon points="990,348 986,340 994,340" fill="#65736b"/>
<rect x="40" y="550" width="536" height="112" rx="12" class="pending"/>
<text x="62" y="584" class="heading">模型与研究 adapters</text>
<text x="62" y="614" class="body">typed 研究源码 / 隔离 Codex 文本证据</text>
<text x="62" y="641" class="body">真实产品执行未部署；格式与预算须匹配</text>
<rect x="624" y="550" width="536" height="112" rx="12" class="pending"/>
<text x="646" y="584" class="heading">受控本机与产品 adapters</text>
<text x="646" y="614" class="body">Apple 候选 / 有界应用规划 / Mio 工具边界</text>
<text x="646" y="641" class="body">首次系统权限与真实动作分别待接受和验收</text>
<path d="M 530 492 V 520 H 308 V 550" class="line wait"/>
<polygon points="308,550 304,542 312,542" fill="#65736b"/>
<path d="M 670 492 V 520 H 892 V 550" class="line wait"/>
<polygon points="892,550 888,542 896,542" fill="#65736b"/>
<text x="40" y="695" class="note">管理面与 metadata-only 服务已有安装验收；本地模型工作已取消，完整产品与 7×24 验收未完成。</text>
<path d="M 40 709 H 1160" stroke="#d6dcd5"/>
<text x="40" y="735" class="note">实线：已有组件 / 代码路径</text>
<text x="360" y="735" class="note">虚线：未启用 / 真实接入待验</text>
<text x="850" y="735" class="note">里程碑 2026-10-01 · MVP 未完成</text>
</svg>
