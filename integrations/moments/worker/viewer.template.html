$('refreshNow').onclick=activeRefresh;
let pullStart=null,pullDistance=0;
window.addEventListener('touchstart',e=>{pullStart=window.scrollY<=2&&e.touches.length===1&&!refreshing?e.touches[0].clientY:null;pullDistance=0},{passive:true});
window.addEventListener('touchmove',e=>{if(pullStart===null||window.scrollY>2)return;pullDistance=e.touches[0].clientY-pullStart;if(pullDistance>20)pullMessage(pullDistance>=85?'松开刷新朋友圈':'下拉刷新朋友圈')},{passive:true});
window.addEventListener('touchend',()=>{if(pullStart!==null&&pullDistance>=85)activeRefresh();else if(!refreshing)pullMessage('');pullStart=null;pullDistance=0},{passive:true});
window.addEventListener('touchcancel',()=>{pullStart=null;pullDistance=0;if(!refreshing)pullMessage('')},{passive:true});
function reset(){clearTimelineFilters();state.year='all';renderYears();filter(true)}
for(const id of ['search','mobileSearch'])$(id).addEventListener('input',e=>{state.search=e.target.value;$(id==='search'?'mobileSearch':'search').value=state.search;clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>filter(),120)});
for(const id of ['mediaOnly','mobileMediaOnly'])$(id).addEventListener('change',e=>{state.mediaOnly=e.target.checked;$(id==='mediaOnly'?'mobileMediaOnly':'mediaOnly').checked=state.mediaOnly;filter(true)});
for(const id of ['sort','mobileSort'])$(id).addEventListener('change',e=>{state.sort=e.target.value;$(id==='sort'?'mobileSort':'sort').value=state.sort;filter(true)});
$('mobileYears').addEventListener('change',e=>jumpToYear(e.target.value));$('reset').onclick=reset;$('loadMore').onclick=appendPosts;$('loadPrevious').onclick=prependPosts;$('toTop').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
$('menu').onclick=e=>{e.stopPropagation();const show=$('settings').classList.toggle('hidden')===false;$('menu').setAttribute('aria-expanded',String(show))};document.addEventListener('click',e=>{if(!$('settings').contains(e.target)&&!$('menu').contains(e.target)){$('settings').classList.add('hidden');$('menu').setAttribute('aria-expanded','false')}});
for(const id of ['importButton','importMenu'])$(id).onclick=()=>$('jsonFile').click();for(const id of ['folderButton','folderMenu'])$(id).onclick=()=>$('imageFolder').click();
$('jsonFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>160*1024*1024)throw Error('JSON 文件超过 160 MB。');const data=validate(JSON.parse(await file.text()));setData(data,'import');reset();notify('已打开 '+file.name)}catch(err){notify(err.message||'无法解析 JSON，当前内容已保留。')}finally{e.target.value=''}});
$('imageFolder').addEventListener('change',e=>{const files=[...e.target.files],map=new Map();for(const f of files){const parts=f.webkitRelativePath.split('/'),index=parts.indexOf('media');if(index>=0){const path=safePath(parts.slice(index).join('/'));if(path)map.set(path,f)}}if(!map.size){notify('未找到 media 目录，请选择备份 data 目录。');return}for(const url of state.objectURLs.values())URL.revokeObjectURL(url);state.objectURLs.clear();state.folder=map;filter();setCover();notify('已关联 '+map.size.toLocaleString()+' 个媒体文件')});
$('showDeleted').onchange=e=>{state.showDeleted=e.target.checked;filter()};$('restore').onclick=()=>{state.mode='snapshot';reset();if(location.protocol==='file:')setData(JSON.parse($('initialData').textContent),'snapshot');else fetchLive(true)};$('refresh').onclick=()=>{if(state.mode==='import'||location.protocol==='file:')$('jsonFile').click();else activeRefresh()};
$('newData').onclick=()=>{if(state.pending)installDataKeepingPosition(state.pending,'live')};
$('closeLightbox').onclick=closeLightbox;$('prevImage').onclick=()=>stepImage(-1);$('nextImage').onclick=()=>stepImage(1);$('lightbox').addEventListener('close',()=>{document.body.style.overflow='';state.lightbox=null});$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox()});document.addEventListener('keydown',e=>{if($('lightbox').open){if(e.key==='ArrowLeft'){e.preventDefault();stepImage(-1)}if(e.key==='ArrowRight'){e.preventDefault();stepImage(1)}}});
new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&state.shown<state.filtered.length&&!$('lightbox').open)appendPosts()},{rootMargin:'250px'}).observe($('loadArea'));
new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&state.start>0&&!$('lightbox').open)prependPosts()},{rootMargin:'400px'}).observe($('loadPreviousArea'));
try{setData(JSON.parse($('initialData').textContent),'snapshot');const year=location.hash.match(/^#year-(\d{4}|unknown)$/)?.[1];if(year)jumpToYear(year)}catch(e){notify('请打开导出的 moments.json');$('feed').append(el('div','empty','选择 JSON 后开始浏览'))}fetchLive();setInterval(()=>fetchLive(),60000);pollImages();setInterval(pollImages,4000);
</script>
</body></html>
